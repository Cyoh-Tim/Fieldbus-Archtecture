name: fc03_read_holding
protocol: modbus_tcp
tags: [fc03, migrate]
device:
  role: server
  unit_id: 1
  n_holding: 64
  n_input: 64
  n_coil: 64
  n_discrete: 64
  iface: mock
steps:
