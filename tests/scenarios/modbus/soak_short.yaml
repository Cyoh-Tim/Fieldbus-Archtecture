# Internal TC MB-T-CYC-001 — FC03 soak with late/missed/jitter. Not Modbus.org.
name: soak_short
id: MB-T-CYC-001
suite: MB-T-v1
protocol: modbus_tcp
tags: [soak, bundle]
device:
  role: server
  unit_id: 1
  n_holding: 16
  n_input: 8
  n_coil: 8
  n_discrete: 8
  iface: mock
  cycle_us: 8000
steps:
  - action: seed
    type: holding
    address: 0
    values: [0x1111, 0x2222]
  - action: soak
    fc: 0x03
    address: 0
    quantity: 2
    iterations: 32
    cycle_ms: 8
    expect:
      min_ok: 32
      unexpected_frames: 0
      min_period_samples: 16
      period_max_ms: 20
      max_late: 8
      max_missed: 0
      jitter_max_ms: 16
