# Internal TC EIP-A-ACD-001 — not an ODVA CT case.
name: acd_identity_state
id: EIP-A-ACD-001
suite: EIP-A-v1
protocol: ethernetip
tags: [acd, identity, migrate, bundle]
device:
  iface: mock
  acd_enable: true
  input_size: 8
  output_size: 8
steps:
  - action: acd_conflict
    conflict: true
  - action: get_attr
    class_id: 0x01
    instance: 1
    attribute: 8
    expect:
      cip_status: 0
      u8: 2
  - action: get_attr
    class_id: 0xF5
    instance: 1
    attribute: 10
    expect:
      cip_status: 0
      u32: 1
  - action: acd_conflict
    conflict: false
  - action: get_attr
    class_id: 0x01
    instance: 1
    attribute: 8
    expect:
      cip_status: 0
      u8: 3
