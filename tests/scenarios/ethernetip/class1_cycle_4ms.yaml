# Internal TC EIP-A-CYC-003 — Class1 metrics at 4 ms. Not ODVA CT timing.
name: class1_cycle_4ms
id: EIP-A-CYC-003
suite: EIP-A-v1
protocol: ethernetip
tags: [class1, cyclic, metrics, bundle]
device:
  iface: mock
  product_name: Cyc4ms
  input_size: 8
  output_size: 8
  rpi_us: 4000
  cycle_us: 4000
steps:
  - action: forward_open
    serial: 0xC004
    orig_serial: 0xC4
    rpi_us: 4000
    o2t_size: 8
    t2o_size: 8
    expect:
      cip_status: 0
      class1: up
  - action: io_cycle
    count: 48
    cycle_ms: 4
    expect:
      min_frames: 48
      min_period_samples: 24
      period_max_ms: 20
      max_late: 16
      max_missed: 0
      jitter_max_ms: 16
      class1: up
