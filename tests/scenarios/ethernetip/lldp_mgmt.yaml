name: lldp_mgmt
protocol: ethernetip
tags: [lldp, migrate]
device:
  iface: eth0
  lldp_enable: true
  lldp_tx_interval_sec: 1
  product_name: LLDPSensor
  input_size: 8
  output_size: 8
steps:
  - action: poll
    count: 1
  - action: get_attr
    class_id: 0x109
    instance: 1
    attribute: 1
    expect:
      cip_status: 0
      u32: 1
  - action: get_attr
    class_id: 0x109
    instance: 1
    attribute: 2
    expect:
      cip_status: 0
      u16: 1
  - action: lldp
    expect:
      ethertype: 0x88CC
      product_name: LLDPSensor
