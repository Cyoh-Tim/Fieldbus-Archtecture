# Internal TC EIP-A-CM-001 — not an ODVA CT case.
name: assembly_fo_io
id: EIP-A-CM-001
suite: EIP-A-v1
protocol: ethernetip
tags: [assembly, forward_open, class1, migrate, bundle]
device:
  iface: mock
  product_name: AsmTest
  input_size: 32
  output_size: 8
  input_assembly: 150
  output_assembly: 101
  config_assembly: 100
steps:
  - action: write_input
    data: "BARCODE-1234567890"
  - action: read_input
    length: 32
    expect:
      data: "BARCODE-1234567890"
  - action: forward_open
    serial: 0x1234
    orig_serial: 0x99
    rpi_us: 8000
    o2t_size: 8
    t2o_size: 32
    expect:
      cip_status: 0
      class1: up
  - action: class1_io
    fill: 0x5A
    length: 8
    seq: 1
    expect:
      u8: 0x5A
      class1: up
