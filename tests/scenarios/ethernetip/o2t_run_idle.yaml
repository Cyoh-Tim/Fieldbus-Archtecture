# Internal TC — Logix O→T 32-bit Run/Idle (T11-1). Not an ODVA CT case.
# output 2 bytes → O→T connection size 8 = data + seq 2 + Run/Idle 4.
# T→O stays modeless (input 4 + seq 2 = 6).
name: o2t_run_idle
id: EIP-A-CM-011
suite: EIP-A-v1
protocol: ethernetip
tags: [forward_open, class1, run_idle, bundle]
device:
  iface: mock
  product_name: RunIdle
  input_size: 4
  output_size: 2
  input_assembly: 150
  output_assembly: 101
  config_assembly: 100
steps:
  - action: forward_open
    serial: 0x11A1
    orig_serial: 0x91
    rpi_us: 20000
    o2t_size: 8
    t2o_size: 6
    expect:
      cip_status: 0
      class1: up
  - action: class1_io
    fill: 0xA5
    length: 2
    seq: 1
    expect:
      u8: 0xA5
      class1: up
  - action: class1_io
    run_idle: 0
    fill: 0xFF
    length: 2
    seq: 2
    expect:
      u8: 0x00
      class1: up
  - action: class1_io
    run_idle: 1
    fill: 0x5A
    length: 2
    seq: 3
    expect:
      u8: 0x5A
      class1: up
