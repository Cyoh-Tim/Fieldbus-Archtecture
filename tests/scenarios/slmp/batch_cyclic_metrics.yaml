# Internal TC SLMP-3E-CYC-002 — not a Mitsubishi certification case.
name: batch_cyclic_metrics
id: SLMP-3E-CYC-002
suite: SLMP-3E-v1
protocol: slmp
tags: [batch, cyclic, metrics, bundle]
device:
  role: server
  frame: 3e_binary
  pc_no: 0xFF
  dest_module_io: 0x03FF
  iface: mock
  cycle_us: 8000
steps:
  - action: seed_words
    device: D
    head: 0
    values: [0x0001]
  - action: soak
    device: D
    head: 0
    unit: word
    quantity: 1
    iterations: 48
    cycle_ms: 8
    expect:
      min_ok: 48
      unexpected_frames: 0
      min_period_samples: 24
      period_max_ms: 20
      max_late: 16
      max_missed: 0
      jitter_max_ms: 16
