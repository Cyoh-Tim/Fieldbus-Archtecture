# Internal TC SLMP-3E-CM-002 — write → read → overwrite → re-write. Not MELSEC cert text.
name: batch_lifetime
id: SLMP-3E-CM-002
suite: SLMP-3E-v1
protocol: slmp
tags: [batch, lifetime, 3e, bundle]
device:
  role: server
  frame: 3e_binary
  pc_no: 0xFF
  dest_module_io: 0x03FF
  iface: mock
steps:
  - action: batch_write
    device: D
    head: 100
    unit: word
    values: [0x1234, 0xABCD]
    expect:
      end_code: 0
  - action: batch_read
    device: D
    head: 100
    unit: word
    quantity: 2
    expect:
      end_code: 0
      values: [0x1234, 0xABCD]
  - action: map_check_words
    device: D
    head: 100
    values: [0x1234, 0xABCD]
  - action: batch_write
    device: D
    head: 100
    unit: word
    values: [0x0000, 0x0000]
    expect:
      end_code: 0
  - action: batch_read
    device: D
    head: 100
    unit: word
    quantity: 2
    expect:
      end_code: 0
      values: [0x0000, 0x0000]
  - action: batch_write
    device: D
    head: 100
    unit: word
    values: [0x1234, 0xABCD]
    expect:
      end_code: 0
  - action: batch_read
    device: D
    head: 100
    unit: word
    quantity: 2
    expect:
      end_code: 0
      values: [0x1234, 0xABCD]
  - action: batch_write
    device: M
    head: 8
    unit: bit
    bits: [1, 0, 1, 1]
    expect:
      end_code: 0
  - action: map_check_bits
    device: M
    head: 8
    bits: [1, 0, 1, 1]
  - action: batch_write
    device: M
    head: 8
    unit: bit
    bits: [0, 0, 0, 0]
    expect:
      end_code: 0
  - action: map_check_bits
    device: M
    head: 8
    bits: [0, 0, 0, 0]
  - action: batch_write
    device: M
    head: 8
    unit: bit
    bits: [1, 0, 1, 1]
    expect:
      end_code: 0
  - action: batch_read
    device: D
    head: 100
    unit: word
    quantity: 2
    expect:
      end_code: 0
      values: [0x1234, 0xABCD]
