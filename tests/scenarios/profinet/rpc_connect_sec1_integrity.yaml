name: rpc_connect_sec1_integrity
protocol: profinet
tags: [rpc, connect, security, phase2]
device:
  station_name: sensor-line1
  security_class: 1
  psk_hex: "2222222222222222222222222222222222222222222222222222222222222222"
  iface: mock
  ip: 192.168.200.2
  netmask: 255.255.255.0
  cycle_us: 8000
  input_len: 32
  output_len: 8
steps:
  - action: rpc_connect
    integrity: true             # block 0x0E01 HMAC
    expect:
      rpc_response: true
      ar: up
      in_frame_id: 0x8001
      out_frame_id: 0x8002
  - action: io_cycle
    count: 8
    cycle_ms: 8
    expect:
      min_frames: 8
      period_max_ms: 20
      ethertype: 0x8892
