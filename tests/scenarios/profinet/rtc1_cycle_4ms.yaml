# Internal TC PN-B-CYC-004 — RTC1 metrics at 4 ms (CC-B, not IRT).
name: rtc1_cycle_4ms
id: PN-B-CYC-004
suite: PN-B-v1
protocol: profinet
tags: [rtc1, cyclic, metrics, bundle]
device:
  station_name: sensor-line1
  security_class: 0
  iface: mock
  ip: 192.168.200.2
  netmask: 255.255.255.0
  cycle_us: 4000
  input_len: 32
  output_len: 8
steps:
  - action: rpc_connect
    integrity: false
    expect:
      ar: up
      in_frame_id: 0x8001
      out_frame_id: 0x8002
  - action: io_cycle
    count: 48
    cycle_ms: 4
    expect:
      min_frames: 48
      min_period_samples: 24
      period_max_ms: 20         # mock soft bound. not IRT
      max_late: 16
      max_missed: 0
      jitter_max_ms: 16
      ethertype: 0x8892
