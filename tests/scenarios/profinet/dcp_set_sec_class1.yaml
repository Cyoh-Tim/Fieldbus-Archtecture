name: dcp_set_sec_class1
id: PN-B-SEC-001
suite: PN-B-v1
protocol: profinet
tags: [dcp, set, security, migrate]
device:
  station_name: old-name
  security_class: 1
  psk_hex: "1111111111111111111111111111111111111111111111111111111111111111"
  iface: mock
steps:
  - action: dcp_set
    signed: false
    name_of_station: new-name
    xid: 0xAABBCCDD
    expect:
      # T12-16: 서명 실패도 ServiceType 1 + BlockError. result:reject 는
      # 하네스가 ServiceType 5 로 본다. 이름은 바뀌지 않아야 한다.
      station_name: old-name
  - action: dcp_set
    signed: true                # HMAC over unsigned DCP body, option 0xF0/0x01
    name_of_station: new-name
    xid: 0xAABBCCDD
    expect:
      result: accept
      station_name: new-name
    golden: tests/golden/profinet/dcp_set_sec_class1_accept.pcap
