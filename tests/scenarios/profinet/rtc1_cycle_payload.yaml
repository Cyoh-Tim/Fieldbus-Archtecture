# Internal TC PN-B-CYC-003 — RTC1 payload + cycle counter + output consume.
name: rtc1_cycle_payload
id: PN-B-CYC-003
suite: PN-B-v1
protocol: profinet
tags: [rtc1, cyclic, payload, bundle]
device:
  station_name: sensor-line1
  security_class: 0
  iface: mock
  ip: 192.168.200.2
  netmask: 255.255.255.0
  cycle_us: 8000
  input_len: 32
  output_len: 8
steps:
  - action: rpc_connect
    integrity: false
    expect:
      ar: up
      in_frame_id: 0x8001
      out_frame_id: 0x8002
  - action: write_input
    data: "CYC-PAYLOAD"
  - action: read_input
    length: 32
    expect:
      contains: CYC-PAYLOAD
  - action: io_cycle
    count: 16
    cycle_ms: 8
    expect:
      min_frames: 16
      min_period_samples: 8
      period_max_ms: 20
      contains: CYC-PAYLOAD
      cycle_counter: increasing
      ethertype: 0x8892
  - action: rt_output
    fill: 0x5A
    frame_id: 0x8002
    expect:
      consumed: true
      u8: 0x5A
  - action: read_output
    length: 8
    expect:
      u8: 0x5A
