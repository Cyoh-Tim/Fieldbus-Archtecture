# Internal TC PN-B-CM-005 — second Connect while AR up is rejected (spec).
# Not PI Bundle text. Keeps the first AR; does not replace it.
name: rpc_ar_replace
id: PN-B-CM-005
suite: PN-B-v1
protocol: profinet
tags: [rpc, connect, lifetime, replace, bundle]
device:
  station_name: sensor-line1
  security_class: 0
  iface: mock
  ip: 192.168.200.2
  netmask: 255.255.255.0
  cycle_us: 8000
  input_len: 32
  output_len: 8
steps:
  - action: rpc_connect
    integrity: false
    expect:
      rpc_response: true
      ar: up
      in_frame_id: 0x8001
      out_frame_id: 0x8002
  - action: io_cycle
    count: 8
    cycle_ms: 8
    expect:
      min_frames: 8
      period_max_ms: 20
      ethertype: 0x8892
  - action: rpc_connect
    integrity: false
    expect:
      rpc_response: true
      ar: up
  - action: io_cycle
    count: 8
    cycle_ms: 8
    expect:
      ar: up
      min_frames: 8
      period_max_ms: 20
      ethertype: 0x8892
  - action: rpc_release
    expect:
      rpc_response: true
      ar: down
  - action: io_cycle
    require_ar: false
    count: 8
    cycle_ms: 8
    expect:
      ar: down
      min_frames: 0
      max_frames: 0
