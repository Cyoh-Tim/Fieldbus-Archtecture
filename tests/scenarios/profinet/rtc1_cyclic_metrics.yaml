# Internal TC PN-B-CYC-002 — not a PI Test Bundle case.
name: rtc1_cyclic_metrics
id: PN-B-CYC-002
suite: PN-B-v1
protocol: profinet
tags: [rtc1, cyclic, metrics, bundle]
device:
  station_name: sensor-line1
  security_class: 0
  iface: mock
  ip: 192.168.200.2
  netmask: 255.255.255.0
  cycle_us: 8000
  input_len: 32
  output_len: 8
steps:
  - action: rpc_connect
    integrity: false
    expect:
      ar: up
      in_frame_id: 0x8001
      out_frame_id: 0x8002
  - action: io_cycle
    count: 48
    cycle_ms: 8
    expect:
      min_frames: 48
      min_period_samples: 24
      period_max_ms: 20         # mock soft bound. not IRT
      max_late: 16              # dt > 1.5 * cycle_us
      max_missed: 0             # dt > 2 * cycle_us
      jitter_max_ms: 16         # max |dt - cycle_us|
      ethertype: 0x8892
      vlan_tci: 0xC000          # PCP 6, VID 0
