name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak:
        description: "Also run 30s CI soak (not in the default PR gate)"
        type: boolean
        default: false
      lab:
        description: "Optional veth AF_PACKET lab (needs sudo; skipped without permissions)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Configure (pn/eip/mb/slmp stacks + ctt, no daemon)
        run: cmake -S . -B build -DBUILD_DAEMON=OFF -DBUILD_CTT=ON -DENABLE_PN_TESTS=ON -DENABLE_EIP_TESTS=ON -DENABLE_MB_TESTS=ON -DENABLE_SLMP_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test (PN+EIP+Modbus+SLMP mock; short soak; golden; exclude 30s soak_ci)
        run: ctest --test-dir build --output-on-failure -LE soak_ci

      - name: Golden replay (mock Identify / Sec1 Set; no NIC)
        run: ctest --test-dir build --output-on-failure -L golden

      - name: EtherNet/IP mock scenarios (no NIC)
        run: ctest --test-dir build --output-on-failure -L ethernetip

  # 경고 회귀 차단: daemon + CTT + 테스트 전체를 -Werror 로 빌드 (빌드만, 테스트는 test/daemon job).
  werror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libssl-dev libcjson-dev
      - name: Configure (-Wall -Wextra -Werror, ${{ matrix.cc }})
        run: >
          cmake -S . -B build-werror -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DBUILD_DAEMON=ON -DBUILD_CTT=ON -DBUILD_API=ON
          -DENABLE_PN_TESTS=ON -DENABLE_EIP_TESTS=ON -DENABLE_MB_TESTS=ON -DENABLE_SLMP_TESTS=ON
          -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
      - name: Build
        run: cmake --build build-werror -j

  # 독립 구현체 오라클 (tests/oracle). 스택은 DUT 로만 띄우고 판정은
  # pymodbus / pymcprotocol / pycomm3 / scapy 가 한다. 알려진 결함은 strict xfail.
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcjson-dev
      - name: Build oracle DUTs
        # 어댑터 수준 DUT(eip_oracle_fbapi, mb_slmp_oracle_app, pn_oracle_app)는 fb_api 를 쓰므로 BUILD_DAEMON=ON.
        # DUT 가 하나라도 없으면 tests/oracle/conftest.py 의 dut_path 가 실행 전체를 실패시킨다.
        run: |
          cmake -S . -B build-oracle -DBUILD_DAEMON=ON -DBUILD_CTT=OFF -DBUILD_PN_LAB_TOOLS=OFF \
                -DENABLE_PN_TESTS=OFF -DENABLE_EIP_TESTS=OFF -DENABLE_MB_TESTS=OFF -DENABLE_SLMP_TESTS=OFF
          cmake --build build-oracle -j --target mb_seeded_server mb_oracle_client slmp_oracle_server slmp_oracle_client \
                eip_oracle_adapter eip_oracle_originator pn_oracle_pipe pn_oracle_lab eip_oracle_fbapi mb_slmp_oracle_app pn_oracle_app
      - name: Install oracles (pinned)
        run: python -m pip install -r tests/oracle/requirements.txt
      - name: Oracle cross-check
        env:
          ORACLE_BUILD_DIR: build-oracle
        run: python -m pytest tests/oracle -v

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev
      - name: Configure (ASan+UBSan)
        run: cmake -S . -B build-san -DBUILD_DAEMON=OFF -DBUILD_CTT=ON -DENABLE_SANITIZERS=ON -DENABLE_PN_TESTS=ON -DENABLE_EIP_TESTS=ON -DENABLE_MB_TESTS=ON -DENABLE_SLMP_TESTS=ON
      - name: Build
        run: cmake --build build-san
      - name: Test under ASan/UBSan (incl. soak_ci)
        run: |
          export ASAN_OPTIONS=detect_leaks=1:halt_on_error=1
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          ctest --test-dir build-san --output-on-failure

  # Long (~1h/target) campaigns live in fuzz-weekly.yml (cron + dispatch).
  # Keep this job at ~60s/target so PRs stay fast.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ cmake libssl-dev libclang-rt-18-dev
      - name: Configure fuzzers
        run: |
          cmake -S . -B build-fuzz -DCMAKE_C_COMPILER=clang -DBUILD_DAEMON=OFF -DBUILD_CTT=OFF -DBUILD_FUZZERS=ON -DENABLE_PN_TESTS=OFF -DENABLE_EIP_TESTS=OFF -DENABLE_MB_TESTS=OFF -DENABLE_SLMP_TESTS=OFF
      - name: Build fuzzers
        run: cmake --build build-fuzz --target fuzz_mb_adu fuzz_slmp_request fuzz_eip_encap fuzz_eip_io fuzz_pn_eth fuzz_pn_rpc
      - name: Seed corpora
        run: python3 tests/fuzz/gen_corpus.py
      - name: Run each target ~60s
        run: |
          set -euo pipefail
          run_one() {
            local bin="$1"
            local corpus="$2"
            shift 2
            echo "==> $bin"
            "./build-fuzz/$bin" -max_total_time=60 -timeout=5 "$@" "$corpus"
          }
          run_one fuzz_mb_adu tests/fuzz/corpus/mb_adu -dict=tests/fuzz/dict/mb_adu.dict
          run_one fuzz_slmp_request tests/fuzz/corpus/slmp_request -dict=tests/fuzz/dict/slmp_request.dict
          run_one fuzz_eip_encap tests/fuzz/corpus/eip_encap -dict=tests/fuzz/dict/eip_encap.dict
          run_one fuzz_eip_io tests/fuzz/corpus/eip_io -dict=tests/fuzz/dict/eip_io.dict
          run_one fuzz_pn_eth tests/fuzz/corpus/pn_eth -dict=tests/fuzz/dict/pn_eth.dict
          run_one fuzz_pn_rpc tests/fuzz/corpus/pn_rpc -dict=tests/fuzz/dict/pn_rpc.dict


  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcjson-dev python3
      - name: Configure (product daemon, no libmodbus)
        run: cmake -S . -B build-daemon -DBUILD_DAEMON=ON -DBUILD_CTT=OFF -DENABLE_PN_TESTS=ON -DENABLE_EIP_TESTS=ON -DENABLE_MB_TESTS=ON -DENABLE_SLMP_TESTS=ON
      - name: Build
        run: cmake --build build-daemon
      - name: Unit tests (stacks + adapters)
        run: ctest --test-dir build-daemon --output-on-failure

  mock-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcjson-dev
      - name: Fake sensor → fb_api readback → CTT mock (all protocols)
        run: examples/run_mock_flow.sh

  codesys-dut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcjson-dev python3
      - name: Modbus DUT + CODESYS-shaped stand-in (not SoftPLC)
        run: examples/run_codesys_dut.sh --stand-in --cycles 16

  sw-master-soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libcjson-dev python3
      - name: Software masters vs live loopback DUT (MB+SLMP+EIP, not CODESYS)
        run: examples/run_sw_master_soak.sh all --seconds 3

  soak-ci:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.soak == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev
      - name: Configure
        run: cmake -S . -B build -DBUILD_DAEMON=OFF -DBUILD_CTT=ON -DENABLE_PN_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: 30s soak
        run: ctest --test-dir build --output-on-failure -L soak_ci

  lab:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.lab == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev iproute2
      - name: Configure
        run: cmake -S . -B build -DBUILD_DAEMON=OFF -DBUILD_CTT=ON -DENABLE_PN_TESTS=ON -DENABLE_CTT_AF_PACKET=ON
      - name: Build
        run: cmake --build build
      - name: veth AF_PACKET subset (skip if no permissions)
        run: tests/run_ctt_lab.sh

  # Nightly soak (1–2 h). Not a PR gate. Uncomment and/or trigger via workflow_dispatch.
  # soak-nightly:
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 150
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: sudo apt-get update && sudo apt-get install -y build-essential cmake
  #     - run: cmake -S . -B build -DBUILD_DAEMON=OFF -DBUILD_CTT=ON -DENABLE_PN_TESTS=ON
  #     - run: cmake --build build
  #     - run: ./build/ctt --scenario tests/scenarios/profinet/nightly/soak_nightly.yaml
